<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" aria-hidden="true">
  <!-- Безшовна сітка Liberville — для великих рівних площин -->
  <g fill="none" stroke="#C0824E" stroke-width="1.6">
    <path d="M0 0V240"/>
    <path d="M0 0H240"/>
    <path d="M120 0V240"/>
    <path d="M0 120H240"/>
    <!-- чверть-дуги в кутах: разом із сусідніми плитками складаються в кола -->
    <path d="M0 60A60 60 0 0 1 60 0"/>
    <path d="M180 240A60 60 0 0 1 240 180"/>
  </g>
</svg>
