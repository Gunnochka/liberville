<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400" aria-hidden="true">
  <!-- Фірмовий патерн Liberville: сітка, дуги та кола за логобуком BRAINTANK -->
  <g fill="none" stroke="#C0824E" stroke-width="3" stroke-linecap="round">
    <!-- сітка -->
    <path d="M430 0V1400"/>
    <path d="M0 600H1400"/>
    <path d="M1010 600V1400"/>
    <path d="M430 970H1400"/>

    <!-- концентричні дуги з центром на перетині 430×600 -->
    <path d="M430 0A600 600 0 0 1 1030 600"/>
    <path d="M430 130A470 470 0 0 1 900 600"/>
    <path d="M430 300A300 300 0 0 1 730 600"/>

    <!-- дуга з центру 1010×600 -->
    <path d="M1400 600A390 390 0 0 1 1010 990"/>
    <path d="M1265 600A255 255 0 0 1 1010 855"/>

    <!-- повне коло -->
    <circle cx="700" cy="1075" r="215"/>
    <circle cx="700" cy="1075" r="96"/>

    <!-- діагоналі -->
    <path d="M1010 600 1400 210"/>
    <path d="M0 1400 430 970"/>
    <path d="M430 970 1010 1400"/>

    <!-- дуга у верхньому лівому куті -->
    <path d="M0 250A250 250 0 0 0 250 0"/>
  </g>
</svg>
